name: OrangeFox [OFRP] v2

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '14.1'
        type: choice
        options:
        - 14.1
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://gitlab.com/naden01/LH8n.git'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'fox_14.1'
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/tecno/LH8n'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'LH8n'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: 'false'
        type: boolean
      LDCHECKPATH:
        description: 'Path of blobs to check'
        required: true
        default: 'system/bin/qseecomd'

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      USE_CCACHE: 1
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_DIR: /mnt/ccache
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Fast Disk Clean-up & Swap Space (24GB)
      run: |
        # Delete heavy pre-installed directories in parallel (~10s vs 4m)
        sudo rm -rf /usr/share/dotnet &
        sudo rm -rf /usr/local/lib/android &
        sudo rm -rf /opt/ghc &
        sudo rm -rf /opt/hostedtoolcache/CodeQL &
        sudo rm -rf /usr/local/share/boost &
        wait
        df -h

        # Allocate 24GB swap instantly using fallocate and lower swappiness to prioritize RAM
        sudo fallocate -l 24G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo sysctl vm.swappiness=10

    - name: Environment Setup
      run: |
        sudo apt-get update -y
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          aria2 bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
          liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush python-is-python3 rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev
        sudo curl -sLo /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
        sudo chmod a+rx /usr/local/bin/repo
      continue-on-error: true

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: /mnt/ccache
        key: ofrp-ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        restore-keys: |
          ofrp-ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.event.inputs.DEVICE_NAME }}-
          ofrp-ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-

    - name: Configure ccache
      run: |
        sudo mkdir -p /mnt/ccache
        sudo chown -R $USER:$USER /mnt/ccache
        ccache -M 8G
        ccache -o compression=true
        ccache -z

    - name: Notify Telegram — Build Started
      run: |
        chmod +x .github/scripts/send_to_telegram.sh
        .github/scripts/send_to_telegram.sh \
          "notify" \
          "${{ github.event.inputs.DEVICE_NAME }}" \
          "${{ github.event.inputs.MANIFEST_BRANCH }}" \
          "" \
          "" \
          "" \
          "" \
          "${{ secrets.TELEGRAM_CHAT_ID }}" \
          "${{ secrets.TELEGRAM_TOKEN }}" \
          "${{ github.workflow }}" \
          "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          "" \
          "" \
          ""

    - name: Set-up & Sync Manifest
      if: github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' || github.event.inputs.MANIFEST_BRANCH == '14.1'
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "naden01"
        git config --global user.email "naden.irsyad01@gmail.com"
        git config --global http.postBuffer 524288000
        git clone --depth=1 https://gitlab.com/OrangeFox/sync.git
        cd sync

        # Patch orangefox_sync.sh to force shallow clones, skip darwin/mips prebuilts, and use max parallel jobs
        sed -i 's/repo init/repo init --depth=1 -g default,-mips,-darwin,-notdefault/g' orangefox_sync.sh
        sed -i 's/repo sync/repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)/g' orangefox_sync.sh

        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
      continue-on-error: true

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone --depth=1 --single-branch ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
      continue-on-error: true

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e

        if [ "${{ github.event.inputs.MANIFEST_BRANCH }}" = "14.1" ]; then
          lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-ap2a-eng
        else
          lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng
        fi

        mka adbd ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        ccache -s
      continue-on-error: true

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV

    - name: Check if Recovery Exist
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        if compgen -G "out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img" > /dev/null; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "Recovery out directory is empty."
        fi
        if compgen -G "out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.zip" > /dev/null; then
            echo "CHECK_ZIP_IS_OK=true" >> $GITHUB_ENV
            echo "MD5_ZIP=$(md5sum out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.zip | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "Recovery out directory is empty."
        fi
      continue-on-error: true

    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true' && env.CHECK_ZIP_IS_OK == 'true'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ github.event.inputs.DEVICE_TREE }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ github.event.inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
          MD5 (img): ${{ env.MD5_IMG }}
          MD5 (zip): ${{ env.MD5_ZIP }}
      continue-on-error: true

    - name: Run LDCheck
      if: github.event.inputs.LDCHECK == 'true'
      run: |
        cd tools
        mv -n libneeds ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
        mv -n ldcheck ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
        cd ../OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ github.event.inputs.LDCHECKPATH }}
        echo "Done checking missing dependencies. Review, and reconfigure your tree."
      continue-on-error: true

    - name: Notify Telegram — Build Done
      if: success()
      run: |
        .github/scripts/send_to_telegram.sh \
          "release" \
          "${{ github.event.inputs.DEVICE_NAME }}" \
          "${{ github.event.inputs.MANIFEST_BRANCH }}" \
          "${{ env.BUILD_DATE }}" \
          "${{ env.COMMIT_ID }}" \
          "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.run_id }}" \
          "${{ env.CLEAN_DEVICE_TREE }}" \
          "${{ secrets.TELEGRAM_CHAT_ID }}" \
          "${{ secrets.TELEGRAM_TOKEN }}" \
          "${{ github.workflow }}" \
          "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          "${{ secrets.GITHUB_TOKEN }}" \
          "${{ github.repository }}" \
          "${{ github.run_id }}"
